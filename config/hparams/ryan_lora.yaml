r: 8
alpha: 16
lr: 5e-5
max_seq_len: 2048
num_perm: 128
num_bands: 32
max_concurrent_tasks: 1
api_timeout_seconds: 45.0
eval_model: "gemini-3.5-flash"
epochs: 3
batch_size: 2
gradient_accumulation_steps: 4
max_grad_norm: 1.0
save_dir: "./checkpoints"
dpo_beta: 0.1
# ==== 模組六：工業級 Packing 與 Streaming 超參數 ====
eos_token_id: 2              # 文本拼接的拼接符標記 (例如 <|endoftext|> ID)
chunk_buffer_size: 1000      # 流式讀取文本的緩衝行數，用以平衡內存與 I/O 頻寬
